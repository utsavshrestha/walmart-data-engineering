name: walmart_db

profile: walmart_db

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  walmart_db:
    +schema: raw

models:
  walmart_db:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
    silver:
      +schema: silver
    gold:
      +schema: gold
      +materialized: table
      ephemeral:
        +materialized: ephemeral
flags:
  require_generic_test_arguments_property: true